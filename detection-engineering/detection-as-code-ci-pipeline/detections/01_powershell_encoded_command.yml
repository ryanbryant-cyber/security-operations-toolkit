title: Suspicious PowerShell Encoded Command
id: 7d3bf66a-38d8-4bb7-b7c9-9ac116b6ef11
status: stable
description: Detects PowerShell execution using encoded command-line arguments that may obscure script content.
author: Ryan Bryant
date: "2026-10-13"

tags:
  - attack.execution
  - attack.t1059.001

logsource:
  product: windows
  category: process_creation

detection:
  selection_image:
    Image|endswith: '\powershell.exe'

  selection_command:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc'

  condition: selection_image and selection_command

falsepositives:
  - Authorized administrative scripts using encoded PowerShell commands

level: high
