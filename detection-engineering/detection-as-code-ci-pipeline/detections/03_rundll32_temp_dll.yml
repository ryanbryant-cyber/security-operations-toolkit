title: Rundll32 Loading DLL From Temporary Directory
id: 5f4d2a18-96bb-4b29-8d75-d6c4e590f1a3
status: experimental
description: Detects rundll32 execution referencing a DLL located within a temporary user or system directory.
author: Ryan Bryant
date: "2026-10-13"

tags:
  - attack.defense_evasion
  - attack.t1218.011

logsource:
  product: windows
  category: process_creation

detection:
  selection_image:
    Image|endswith: '\rundll32.exe'

  selection_command:
    CommandLine|contains:
      - '\Temp\'
      - '\AppData\Local\Temp\'

  condition: selection_image and selection_command

falsepositives:
  - Legitimate software installers using temporary DLL locations

level: medium
