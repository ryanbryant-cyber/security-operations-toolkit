title: Suspicious PowerShell Encoded Command
id: 3a6c1a27-8db0-4e0a-a8b5-7f0e64f1c9d2
status: experimental
description: Detects PowerShell processes launched with encoded command-line arguments.
author: Ryan Bryant
date: 2026-09-17

logsource:
  product: windows
  category: process_creation

detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_command:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc'

  condition: selection_image and selection_command

falsepositives:
  - Legitimate administrative scripts using encoded PowerShell commands
  - Approved automation or management software

level: high

tags:
  - attack.execution
  - attack.t1059.001
