title: Failed Windows Logon
id: 6fdf2445-21c3-48c8-9470-a2563265a53b
status: experimental
description: Detects failed Windows authentication events for analyst review.
author: Ryan Bryant
date: 2026-09-17

logsource:
  product: windows
  service: security

detection:
  selection:
    EventID: 4625

  condition: selection

falsepositives:
  - User mistyped password
  - Expired credentials
  - Misconfigured scheduled tasks or services
  - Legitimate remote access troubleshooting

level: medium

tags:
  - attack.credential-access
  - attack.t1110
